# VBWR E

name: Release
run-name: Release ${{ inputs.tag }} (draft=${{ inputs.draft }})

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New tag matching Cargo.toml, optionally ending in -stable
        required: true
        type: string
        default: v0.1.0-stable
      draft:
        description: Create a draft for review
        type: boolean
        default: true
      prerelease:
        description: Mark as prerelease
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: manual-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  prepare:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require a new tag matching the package version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $versionLine = Select-String -LiteralPath Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $versionLine) { throw 'Package version was not found in Cargo.toml.' }
          $version = $versionLine.Matches[0].Groups[1].Value
          if ($env:RELEASE_TAG -cnotin @("v$version", "v$version-stable")) { throw 'Tag must match Cargo.toml, optionally ending in -stable.' }
          $existing = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Could not check existing tags.' }
          if ($existing) { throw 'This tag already exists. Existing releases are never overwritten.' }

  package:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            label: windows-arm64
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-x64
          - runner: macos-15
            target: aarch64-apple-darwin
            label: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Linux development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libxdo-dev libxkbcommon-dev libfontconfig1-dev libwayland-dev libx11-xcb-dev libxcursor-dev libxkbcommon-x11-dev
      - name: Add Rust target
        shell: pwsh
        run: |
          rustup target add ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { throw 'Rust target installation failed.' }
      - name: Build release executables
        shell: pwsh
        run: |
          cargo build --locked --release --target ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }
      - name: Package executable, documentation and notices
        shell: pwsh
        run: ./scripts/package-release.ps1 -Target '${{ matrix.target }}' -Label '${{ matrix.label }}' -Tag $env:RELEASE_TAG
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: |
            dist/ulanzi-dock-vibeware-*.zip
            dist/ulanzi-dock-vibeware-*.tar.gz
            dist/ulanzi-dock-vibeware-*.sha256
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Create the requested release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          IS_DRAFT: ${{ inputs.draft }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archives = @(Get-ChildItem -LiteralPath dist -File | Where-Object { $_.Name -match '\.(zip|tar\.gz)$' })
          $checksums = @(Get-ChildItem -LiteralPath dist -Filter '*.sha256')
          if ($archives.Count -ne 5 -or $checksums.Count -ne 5) { throw 'All five platform archives and checksums are required.' }
          Push-Location dist
          try {
            Get-Content -LiteralPath $checksums.FullName | Set-Content -LiteralPath SHA256SUMS.txt -Encoding ascii
            & sha256sum --check SHA256SUMS.txt
            if ($LASTEXITCODE -ne 0) { throw 'Archive checksum validation failed.' }
          } finally { Pop-Location }
          $cliArgs = @('release', 'create', $env:RELEASE_TAG, '--target', $env:SOURCE_SHA,
            '--title', "UlanziDock VibeWare 0.1.0", '--generate-notes',
            "--draft=$env:IS_DRAFT", "--prerelease=$env:IS_PRERELEASE")
          $cliArgs += $archives.FullName
          $cliArgs += 'dist/SHA256SUMS.txt'
          gh @cliArgs
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
