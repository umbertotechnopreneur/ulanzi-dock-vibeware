name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      check_cli:
        description: "Authorize CLI checks for this manual build"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            label: windows-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Add Rust target
        shell: pwsh
        run: rustup target add ${{ matrix.target }}
      - name: Build standalone EXE
        shell: pwsh
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Check CLI
        if: github.event_name == 'workflow_dispatch' && inputs.check_cli
        shell: pwsh
        run: |
          & "target/${{ matrix.target }}/release/ulanzi-dock-vibeware.exe" themes
          & "target/${{ matrix.target }}/release/ulanzi-dock-vibeware.exe" --help
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ulanzi-dock-vibeware.exe" package/
          Copy-Item README.md,LICENSE,docs/ulanzi-dock-vibeware-guide-v2.pdf package/
          Compress-Archive -Path package/* -DestinationPath "ulanzi-dock-vibeware-${{ matrix.label }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ulanzi-dock-vibeware-${{ matrix.label }}
          path: ulanzi-dock-vibeware-${{ matrix.label }}.zip

  portable-check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile source
        run: cargo check --locked
